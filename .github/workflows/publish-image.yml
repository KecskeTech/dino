name: Publish container image

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "hls.min.js"
      - "jellydinosaur-flash-player.swf"
      - "build-minify.js"
      - "docs/**"
      - "Dockerfile"
      - "deploy/nginx.conf"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kecsketech/dino:latest
            ghcr.io/kecsketech/dino:${{ github.sha }}
